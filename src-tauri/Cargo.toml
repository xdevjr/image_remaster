[package]
name = "image-remaster"
version = "0.1.0"
description = "Upscale e remaster de imagens com Real-ESRGAN"
edition = "2021"

[lib]
name = "image_remaster_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
tauri = { version = "2.12.7", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.8.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif", "tiff"] }
ort = { version = "=2.0.0-rc.15", features = ["cuda"] }

[features]
# Usa os assets embutidos no binário (necessário para builds de produção).
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
